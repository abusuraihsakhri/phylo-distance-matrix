name: Scientific regression suite

on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: pytest -q
        env:
          AUDIT_SECRET_KEY: ci-only-test-key
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.mjs
      - run: node --test web/app.test.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phylo-distance-matrix:ci .
